services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - ./apps/api/.env
    environment:
      DATABASE_URL: postgresql://surf_window:surf_window@db:5432/surf_window
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - api

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: surf_window
      POSTGRES_PASSWORD: surf_window
      POSTGRES_DB: surf_window
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U surf_window -d surf_window"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
